/* =========================================
   BASIC
========================================= */

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    Arial,
    sans-serif;

  background: #f5f7f9;

  color: #263238;

}


button,
input,
select {

  font-family: inherit;

}


/* =========================================
   APP
========================================= */

.app {

  min-height: 100vh;

}

/* =========================================
   TOPBAR
========================================= */

.topbar {

  background: #176b63;

  color: white;

  padding: 10px 22px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,0.12);

}

  margin: 0;

  font-size: 24px;

}

.subtitle {

  margin-top: 4px;

  font-size: 13px;

  opacity: 0.85;

}


/* =========================================
   SEARCH
========================================= */

.searchSection {

  padding: 20px 20px 10px;

  max-width: 1100px;

  margin: auto;

}

.searchBox {

  position: relative;

  background: white;

  border: 1px solid #d9dfe3;

  border-radius: 12px;

  display: flex;

  align-items: center;

  box-shadow:
    0 2px 6px
    rgba(0,0,0,0.05);

}

.searchIcon {

  padding-left: 14px;

  font-size: 18px;

}

.searchBox input {

  flex: 1;

  border: none;

  outline: none;

  padding: 14px;

  font-size: 16px;

  background: transparent;

}

.clearButton {

  border: none;

  background: none;

  font-size: 25px;

  cursor: pointer;

  padding: 5px 14px;

  color: #777;

}


/* =========================================
   FILTERS
========================================= */

.filters {

  max-width: 1100px;

  margin: auto;

  padding: 10px 20px;

  display: flex;

  gap: 10px;

  flex-wrap: wrap;

}

.filters select {

  padding: 10px 12px;

  border-radius: 9px;

  border: 1px solid #ccd4d8;

  background: white;

  font-size: 14px;

  cursor: pointer;

}

.favoriteFilter {

  padding: 10px 14px;

  border-radius: 9px;

  border: 1px solid #ccd4d8;

  background: white;

  cursor: pointer;

}

.favoriteFilter.active {

  background: #fff3cd;

  border-color: #e6c95c;

}


/* =========================================
   RESULT BAR
========================================= */

.resultBar {

  max-width: 1100px;

  margin: auto;

  padding: 5px 20px 12px;

  color: #68757d;

  font-size: 13px;

}


/* =========================================
   WORD LIST
========================================= */

.wordList {

  max-width: 1100px;

  margin: auto;

  padding: 0 20px 30px;

  display: grid;

  grid-template-columns:
    repeat(auto-fill, minmax(250px, 1fr));

  gap: 14px;

}


/* =========================================
   WORD CARD
========================================= */

.wordCard {

  background: white;

  border-radius: 14px;

  overflow: hidden;

  border: 1px solid #e0e5e8;

  cursor: pointer;

  transition:
    transform .15s,
    box-shadow .15s;

}

.wordCard:hover {

  transform: translateY(-2px);

  box-shadow:
    0 5px 16px
    rgba(0,0,0,0.10);

}


.cardImage {

  height: 150px;

  background: #eef3f2;

  display: flex;

  justify-content: center;

  align-items: center;

  overflow: hidden;

}

.cardImage img {

  width: 100%;

  height: 100%;

  object-fit: contain;

}

.noImage {

  font-size: 48px;

}


.cardBody {

  padding: 15px;

}

.cardTop {

  display: flex;

  justify-content: space-between;

  align-items: flex-start;

  gap: 10px;

}

.word {

  font-size: 23px;

  font-weight: bold;

  color: #176b63;

}

.favoriteButton {

  border: none;

  background: transparent;

  font-size: 23px;

  color: #aeb6ba;

  cursor: pointer;

  padding: 2px 5px;

  line-height: 1;

}

.favoriteButton:hover {

  transform: scale(1.15);

  color: #e1b400;

}

.favoriteButton.active {

  color: #e1b400;

}

.favoriteButton:disabled {

  cursor: wait;

  opacity: 0.6;

}

.category {

  font-size: 12px;

  color: #68757d;

  margin-top: 4px;

}

.meaning {

  margin-top: 10px;

  line-height: 1.4;

  font-size: 14px;

}

.cardMeta {

  margin-top: 12px;

  display: flex;

  gap: 6px;

  flex-wrap: wrap;

}

.tag {

  background: #edf5f4;

  color: #176b63;

  padding: 4px 8px;

  border-radius: 20px;

  font-size: 11px;

}


/* =========================================
   NO RESULTS
========================================= */

.noResults {

  text-align: center;

  padding: 60px 20px;

  color: #68757d;

}

   MODAL
========================================= */

.modal {

  position: fixed;

  inset: 0;

  z-index: 1000;

}


.modalOverlay {

  position: absolute;

  inset: 0;

  background: rgba(0,0,0,0.5);

}


.modalCard {

  position: relative;

  width: min(92%, 850px);

  max-height: 90vh;

  border-radius: 18px;

  z-index: 2;

  box-shadow:
    0 15px 50px
    rgba(0,0,0,0.25);

  overflow: hidden;

  display: grid;

  grid-template-columns: 42% 58%;

}


/* =========================================
   CLOSE BUTTON
========================================= */

.closeButton {

  background: white;

  height: 38px;

  border-radius: 50%;

  font-size: 27px;

  cursor: pointer;

  box-shadow:

========================================= */

  padding: 12px;

  border: 1px solid #d8dee1;

  background: white;

  border-radius: 10px;

  cursor: pointer;

  font-size: 14px;

}

/* =========================================

========================================= */
