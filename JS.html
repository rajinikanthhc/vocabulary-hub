<script>

let vocabulary = [];

let filteredVocabulary = [];

let currentWord = null;

let favoriteOnly = false;

let currentWordIndex = -1;


/* =========================================
   START
========================================= */

window.addEventListener(
  'load',
  function () {

    loadVocabulary();

  }
);


/* =========================================
   LOAD VOCABULARY
========================================= */

function loadVocabulary() {

  google.script.run

    .withSuccessHandler(
      function (data) {

        vocabulary =
          data || [];

        populateFilters();

        applyFilters();

      }
    )

    .withFailureHandler(
      function (error) {

        console.error(error);

        document
          .getElementById('resultCount')
          .textContent =
            'Error loading vocabulary';

        alert(
          error.message ||
          'Unable to load vocabulary.'
        );

      }
    )

    .getVocabulary();

}


/* =========================================
   POPULATE FILTERS
========================================= */

function populateFilters() {

  const categoryFilter =
    document.getElementById(
      'categoryFilter'
    );


  const levelFilter =
    document.getElementById(
      'levelFilter'
    );


  const categories = [];

  const levels = [];


  vocabulary.forEach(
    function (word) {

      const category =
        String(
          word.Category || ''
        ).trim();


      const level =
        String(
          word.Level || ''
        ).trim();


      if (
        category &&
        !categories.includes(category)
      ) {

        categories.push(category);

      }


      if (
        level &&
        !levels.includes(level)
      ) {

        levels.push(level);

      }

    }
  );


  categories.sort();

  levels.sort();


  categoryFilter.innerHTML =
    '<option value="">All Categories</option>';


  levelFilter.innerHTML =
    '<option value="">All Levels</option>';


  categories.forEach(
    function (category) {

      const option =
        document.createElement(
          'option'
        );

      option.value =
        category;

      option.textContent =
        category;

      categoryFilter.appendChild(
        option
      );

    }
  );


  levels.forEach(
    function (level) {

      const option =
        document.createElement(
          'option'
        );

      option.value =
        level;

      option.textContent =
        level;

      levelFilter.appendChild(
        option
      );

    }
  );

}


/* =========================================
   APPLY FILTERS
========================================= */

function applyFilters() {

  const search =
    document
      .getElementById('searchInput')
      .value
      .toLowerCase()
      .trim();


  const category =
    document
      .getElementById('categoryFilter')
      .value;


  const level =
    document
      .getElementById('levelFilter')
      .value;


  const sortValue =
    document
      .getElementById('sortFilter')
      .value;


  filteredVocabulary =
    vocabulary.filter(
      function (word) {

        const wordText =
          String(
            word.Word || ''
          ).toLowerCase();


        const meaning =
          String(
            word.Meaning || ''
          ).toLowerCase();


        const phonics =
          String(
            word.Phonics || ''
          ).toLowerCase();


        const categoryText =
          String(
            word.Category || ''
          ).trim();


        const levelText =
          String(
            word.Level || ''
          ).trim();


        const searchMatch =
          !search ||
          wordText.includes(search) ||
          meaning.includes(search) ||
          phonics.includes(search);


        const categoryMatch =
          !category ||
          categoryText === category;


        const levelMatch =
          !level ||
          levelText === level;


        const favoriteMatch =
          !favoriteOnly ||
          isFavorite(word);


        return (
          searchMatch &&
          categoryMatch &&
          levelMatch &&
          favoriteMatch
        );

      }
    );


  /* =====================================
     SORT
  ====================================== */

  if (
    sortValue === 'az'
  ) {

    filteredVocabulary.sort(
      function (a, b) {

        return String(
          a.Word || ''
        ).localeCompare(
          String(
            b.Word || ''
          ),
          undefined,
          {
            sensitivity: 'base'
          }
        );

      }
    );

  }


  else if (
    sortValue === 'za'
  ) {

    filteredVocabulary.sort(
      function (a, b) {

        return String(
          b.Word || ''
        ).localeCompare(
          String(
            a.Word || ''
          ),
          undefined,
          {
            sensitivity: 'base'
          }
        );

      }
    );

  }


  else if (
    sortValue === 'newest'
  ) {

    filteredVocabulary.sort(
      function (a, b) {

        return (
          Number(b.ID || 0) -
          Number(a.ID || 0)
        );

      }
    );

  }


  else if (
    sortValue === 'oldest'
  ) {

    filteredVocabulary.sort(
      function (a, b) {

        return (
          Number(a.ID || 0) -
          Number(b.ID || 0)
        );

      }
    );

  }


  renderWords();


  document
    .getElementById('clearSearch')
    .style.display =
      search ? 'block' : 'none';

}


/* =========================================
   FAVORITE FILTER
========================================= */

function toggleFavoriteFilter() {

  favoriteOnly =
    !favoriteOnly;


  const button =
    document.getElementById(
      'favoriteFilter'
    );


  if (favoriteOnly) {

    button.classList.add(
      'active'
    );

    button.textContent =
      '★ Favorites';

  } else {

    button.classList.remove(
      'active'
    );

    button.textContent =
      '☆ Favorites';

  }


  applyFilters();

}


/* =========================================
   FAVORITE CHECK
========================================= */

function isFavorite(word) {

  return String(
    word.Favorite || ''
  ).toLowerCase() === 'yes';

}


/* =========================================
   RENDER WORDS
========================================= */

function renderWords() {

  const list =
    document.getElementById(
      'wordList'
    );


  const empty =
    document.getElementById(
      'noResults'
    );


  const count =
    document.getElementById(
      'resultCount'
    );


  list.innerHTML = '';


  count.textContent =
    filteredVocabulary.length +
    (
      filteredVocabulary.length === 1
        ? ' word'
        : ' words'
    );


  if (
    filteredVocabulary.length === 0
  ) {

    empty.style.display =
      'block';

    return;

  }


  empty.style.display =
    'none';


  filteredVocabulary.forEach(
    function (word) {

      const card =
        document.createElement(
          'div'
        );


      card.className =
        'wordCard';


      const favorite =
        isFavorite(word);


      card.innerHTML =

        '<div class="cardBody">' +

          '<div class="cardTop">' +

            '<div class="word">' +
              escapeHtml(word.Word) +
            '</div>' +

            '<div class="cardActions">' +

              '<button class="favoriteButton ' +
                (
                  favorite
                    ? 'active'
                    : ''
                ) +
                '" title="' +
                (
                  favorite
                    ? 'Remove from Favorites'
                    : 'Add to Favorites'
                ) +
                '">' +

                (
                  favorite
                    ? '★'
                    : '☆'
                ) +

              '</button>' +

              '<button ' +
                'class="editButton" ' +
                'title="Edit">✏️</button>' +

            '</div>' +

          '</div>' +

          '<div class="category">' +
            escapeHtml(
              word.Category || ''
            ) +
          '</div>' +

          '<div class="meaning">' +
            escapeHtml(
              word.Meaning || ''
            ) +
          '</div>' +

          '<div class="cardMeta">' +

            '<span class="tag">' +
              escapeHtml(
                word.Phonics || '-'
              ) +
            '</span>' +

            '<span class="tag">' +
              escapeHtml(
                word.IPA || '-'
              ) +
            '</span>' +

            '<span class="tag">' +
              escapeHtml(
                word.Syllable || '-'
              ) +
            '</span>' +

            '<button ' +
              'class="soundButton" ' +
              'title="Hear Word">🔊</button>' +

          '</div>' +

        '</div>';


      card.addEventListener(
        'click',
        function () {

          openWord(word);

        }
      );


      const star =
        card.querySelector(
          '.favoriteButton'
        );


      star.addEventListener(
        'click',
        function (event) {

          event.stopPropagation();

          toggleHomeFavorite(
            word,
            star
          );

        }
      );


      const editButton =
        card.querySelector(
          '.editButton'
        );


      editButton.addEventListener(
        'click',
        function (event) {

          event.stopPropagation();

          openEdit(word);

        }
      );


      const soundButton =
        card.querySelector(
          '.soundButton'
        );


      soundButton.addEventListener(
        'click',
        function (event) {

          event.stopPropagation();

          speakWord(
            word.Word
          );

        }
      );


      list.appendChild(card);

    }
  );

}


/* =========================================
   HOME FAVORITE
========================================= */

function toggleHomeFavorite(
  word,
  star
) {

  const newValue =
    !isFavorite(word);


  star.disabled =
    true;


  google.script.run

    .withSuccessHandler(
      function () {

        word.Favorite =
          newValue
            ? 'Yes'
            : '';


        vocabulary.forEach(
          function (item) {

            if (
              String(item.ID) ===
              String(word.ID)
            ) {

              item.Favorite =
                newValue
                  ? 'Yes'
                  : '';

            }

          }
        );


        if (newValue) {

          star.textContent =
            '★';

          star.classList.add(
            'active'
          );

          star.title =
            'Remove from Favorites';

        } else {

          star.textContent =
            '☆';

          star.classList.remove(
            'active'
          );

          star.title =
            'Add to Favorites';

        }


        star.disabled =
          false;


        if (favoriteOnly) {

          applyFilters();

        }

      }
    )

    .withFailureHandler(
      function (error) {

        star.disabled =
          false;

        alert(
          error.message ||
          'Unable to update favorite.'
        );

      }
    )

    .updateFavorite(
      word.ID,
      newValue
    );

}


/* =========================================
   OPEN WORD
========================================= */

function openWord(word) {

  currentWord =
    word;


  currentWordIndex =
    filteredVocabulary.findIndex(
      function (item) {

        return String(item.ID) ===
          String(word.ID);

      }
    );


  document
    .getElementById('modalCategory')
    .textContent =
      word.Category || '';


  document
    .getElementById('modalWord')
    .textContent =
      word.Word || '';


  document
    .getElementById('modalMeaning')
    .textContent =
      word.Meaning || '';


  document
    .getElementById('modalPhonics')
    .textContent =
      word.Phonics || '-';


  document
    .getElementById('modalIPA')
    .textContent =
      word.IPA || '-';


  document
    .getElementById('modalSyllable')
    .textContent =
      word.Syllable || '-';


  document
    .getElementById('modalLevel')
    .textContent =
      word.Level || '-';


  /* =====================================
     IMAGE
  ====================================== */

  const imageBox =
    document.getElementById(
      'modalImage'
    );


  imageBox.innerHTML =
    '';


  if (word.Image) {

    const image =
      document.createElement(
        'img'
      );


    image.src =
      'https://raw.githubusercontent.com/' +
      'rajinikanthhc/images/main/vocabulary/' +
      encodeURIComponent(
        word.Image
      );


    image.alt =
      word.Word ||
      'Vocabulary image';


    image.onerror =
      function () {

        imageBox.innerHTML =
          '';

      };


    imageBox.appendChild(
      image
    );

  }


  updateModalFavorite();

  updateWordNavigation();


  document
    .getElementById('wordModal')
    .style.display =
      'block';


  document.body.style.overflow =
    'hidden';

}


/* =========================================
   WORD NAVIGATION
========================================= */

function updateWordNavigation() {

  const previousButton =
    document.getElementById(
      'previousWordButton'
    );


  const nextButton =
    document.getElementById(
      'nextWordButton'
    );


  if (
    !previousButton ||
    !nextButton
  ) {

    return;

  }


  previousButton.disabled =
    currentWordIndex <= 0;


  nextButton.disabled =
    currentWordIndex === -1 ||
    currentWordIndex >=
      filteredVocabulary.length - 1;

}


function openPreviousWord() {

  if (
    currentWordIndex <= 0
  ) {

    return;

  }


  currentWordIndex--;


  openWord(
    filteredVocabulary[
      currentWordIndex
    ]
  );

}


function openNextWord() {

  if (
    currentWordIndex === -1 ||
    currentWordIndex >=
      filteredVocabulary.length - 1
  ) {

    return;

  }


  currentWordIndex++;


  openWord(
    filteredVocabulary[
      currentWordIndex
    ]
  );

}


/* =========================================
   CLOSE WORD
========================================= */

function closeWord() {

  document
    .getElementById('wordModal')
    .style.display =
      'none';


  document.body.style.overflow =
    '';


  currentWord =
    null;

}


/* =========================================
   SPEAK CURRENT WORD
========================================= */

function speakCurrentWord() {

  if (!currentWord) {
    return;
  }


  const speech =
    new SpeechSynthesisUtterance(
      currentWord.Word
    );


  speech.lang =
    'en-US';


  speech.rate =
    0.8;


  window.speechSynthesis.cancel();

  window.speechSynthesis.speak(
    speech
  );

}


/* =========================================
   CURRENT FAVORITE
========================================= */

function toggleCurrentFavorite() {

  if (!currentWord) {
    return;
  }


  const newValue =
    !isFavorite(
      currentWord
    );


  google.script.run

    .withSuccessHandler(
      function () {

        currentWord.Favorite =
          newValue
            ? 'Yes'
            : '';


        vocabulary.forEach(
          function (item) {

            if (
              String(item.ID) ===
              String(currentWord.ID)
            ) {

              item.Favorite =
                newValue
                  ? 'Yes'
                  : '';

            }

          }
        );


        updateModalFavorite();

        applyFilters();

      }
    )

    .withFailureHandler(
      function (error) {

        alert(
          error.message ||
          'Unable to update favorite.'
        );

      }
    )

    .updateFavorite(
      currentWord.ID,
      newValue
    );

}


/* =========================================
   MODAL FAVORITE
========================================= */

function updateModalFavorite() {

  const button =
    document.getElementById(
      'modalFavorite'
    );


  if (!currentWord) {
    return;
  }


  if (
    isFavorite(currentWord)
  ) {

    button.textContent =
      '★ Remove from Favorites';

  } else {

    button.textContent =
      '☆ Add to Favorites';

  }

}


/* =========================================
   CLEAR SEARCH
========================================= */

function clearSearch() {

  document
    .getElementById('searchInput')
    .value =
      '';


  document
    .getElementById('clearSearch')
    .style.display =
      'none';


  applyFilters();

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

  return String(
    value || ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}

/* =========================================
   SAVE EDITED WORD
   Saves automatic image to GitHub first
========================================= */

function saveEditedWord() {

  if (!currentWord) {
    return;
  }


  /* =====================================
     READ ALL FIELDS
  ====================================== */

  const updatedWord = {

    ID:
      currentWord.ID,

    Word:
      document
        .getElementById('editWord')
        .value
        .trim(),

    Category:
      document
        .getElementById('editCategory')
        .value
        .trim(),

    Level:
      document
        .getElementById('editLevel')
        .value
        .trim(),

    Meaning:
      document
        .getElementById('editMeaning')
        .value
        .trim(),

    Phonics:
      document
        .getElementById('editPhonics')
        .value
        .trim(),

    IPA:
      document
        .getElementById('editIPA')
        .value
        .trim(),

    Syllable:
      document
        .getElementById('editSyllable')
        .value
        .trim(),

    Image:
      document
        .getElementById('editImage')
        .value
        .trim(),

    Favorite:
      currentWord.Favorite || ''

  };


  /* =====================================
     VALIDATION
  ====================================== */

  if (!updatedWord.Word) {

    alert(
      'Please enter the word.'
    );

    return;

  }


  /* =====================================
     CHECK AUTOMATIC IMAGE URL
  ====================================== */

  const imageUrl =
    document
      .getElementById('editImageUrl')
      .value
      .trim();


  const status =
    document.getElementById(
      'editImageUploadStatus'
    );


  /* =====================================
     SAVE WORD TO SHEET
  ====================================== */

  function saveWordToSheet() {

    google.script.run

      .withSuccessHandler(
        function() {

          const index =
            vocabulary.findIndex(
              function(item) {

                return String(
                  item.ID
                ) ===
                String(
                  updatedWord.ID
                );

              }
            );


          if (index !== -1) {

            vocabulary[index] =
              updatedWord;

          }


          currentWord =
            updatedWord;


          if (status) {

            status.textContent =
              '✓ Changes saved';

          }


          closeEdit();

          populateFilters();

          applyFilters();

        }
      )

      .withFailureHandler(
        function(error) {

          if (status) {

            status.textContent =
              '';

          }

          alert(
            error.message ||
            'Unable to save changes.'
          );

        }
      )

      .updateVocabulary(
        updatedWord
      );

  }


  /* =====================================
     AUTOMATIC IMAGE SELECTED
  ====================================== */

  if (imageUrl) {

    if (status) {

      status.textContent =
        '⬇️ Downloading picture...';

    }


    google.script.run

      .withSuccessHandler(
        function(result) {

          const imageName =
            result &&
            (
              result.fileName ||
              result.path ||
              ''
            );


          if (!imageName) {

            if (status) {

              status.textContent =
                '';

            }

            alert(
              'Picture downloaded, but GitHub filename was not returned.'
            );

            return;

          }


          const cleanImageName =
            String(imageName)
              .split('/')
              .pop();


          /* ===============================
             USE NEW GITHUB IMAGE
          =============================== */

          updatedWord.Image =
            cleanImageName;


          if (status) {

            status.textContent =
              '✓ Picture uploaded to GitHub. Saving changes...';

          }


          saveWordToSheet();

        }
      )

      .withFailureHandler(
        function(error) {

          if (status) {

            status.textContent =
              '';

          }

          alert(
            'Unable to download/upload picture:\n' +
            (
              error.message ||
              'Unknown error'
            )
          );

        }
      )

      .uploadVocabularyImageFromUrl(
        imageUrl,
        updatedWord.Word,
        updatedWord.Category
      );


    return;

  }


  /* =====================================
     NO AUTOMATIC IMAGE
     JUST SAVE OTHER CHANGES
  ====================================== */

  if (status) {

    status.textContent =
      'Saving changes...';

  }


  saveWordToSheet();

}

/* =========================================
   SAVE NEW WORD
========================================= */

function saveNewWord() {

  const word =
    document
      .getElementById('addWord')
      .value
      .trim();


  const category =
    document
      .getElementById('addCategory')
      .value
      .trim();


  const level =
    document
      .getElementById('addLevel')
      .value
      .trim();


  const meaning =
    document
      .getElementById('addMeaning')
      .value
      .trim();


  const phonics =
    document
      .getElementById('addPhonics')
      .value
      .trim();


  const ipa =
    document
      .getElementById('addIPA')
      .value
      .trim();


  const syllable =
    document
      .getElementById('addSyllable')
      .value
      .trim();


  const imageFile =
    document
      .getElementById('addImageFile')
      .files[0];


  const automaticImageUrl =
    document

      .value
      .trim();


  /* =====================================
     VALIDATION
  ====================================== */

  if (!word) {

    alert(
      'Please enter the word.'
    );

    return;

  }


  if (!category) {

    alert(
      'Please click Auto Fill first so Category is determined automatically.'
    );

    return;

  }


  if (!level) {

    alert(
      'Please click Auto Fill first so Level is determined automatically.'
    );

    return;

  }


  if (
    !imageFile &&
    !automaticImageUrl
  ) {

    alert(
      'Please click Auto Fill to find a picture, or select an image manually.'
    );

    return;

  }


  /* =====================================
     CLIENT DUPLICATE CHECK
  ====================================== */

  const duplicate =
    vocabulary.some(
      function (item) {

        return String(
          item.Word || ''
        )
          .trim()
          .toLowerCase() ===
          word.toLowerCase();

      }
    );


  if (duplicate) {

    alert(
      'Word already exists: "' +
      word +
      '"'
    );


    document
      .getElementById('addWord')
      .focus();


    return;

  }


  const status =
    document.getElementById(
      'imageUploadStatus'
    );


  const saveWord =
    function (imageName) {

      const newWord = {

        Word:
          word,

        Category:
          category,

        Level:
          level,

        Meaning:
          meaning,

        Phonics:
          phonics,

        IPA:
          ipa,

        Syllable:
          syllable,

        Image:
          imageName,

        Favorite:
          ''

      };


      status.textContent =
        'Saving word...';


      google.script.run

        .withSuccessHandler(
          function () {

            closeAddWord();

            loadVocabulary();

          }
        )

        .withFailureHandler(
          function (error) {

            status.textContent =
              '';

            alert(
              error.message ||
              'Unable to save word.'
            );

          }
        )

        .addVocabulary(
          newWord
        );

    };


  /* =====================================
     MANUAL IMAGE
     MANUAL IMAGE TAKES PRIORITY
  ====================================== */

  if (imageFile) {

    status.textContent =
      'Uploading image...';


    const reader =
      new FileReader();


    reader.onload =
      function (event) {

        const base64 =
          event.target.result
            .split(',')[1];


        const fileData = {

          base64:
            base64,

          mimeType:
            imageFile.type

        };


        google.script.run

          .withSuccessHandler(
            function (result) {

              status.textContent =
                'Image uploaded. Saving word...';


              saveWord(
                result.fileName
              );

            }
          )

          .withFailureHandler(
            function (error) {

              status.textContent =
                '';

              alert(
                error.message ||
                'Unable to upload image.'
              );

            }
          )

          .uploadVocabularyImage(
            fileData,
            word,
            category
          );

      };


    reader.readAsDataURL(
      imageFile
    );


    return;

  }


  /* =====================================
     AUTOMATIC IMAGE
  ====================================== */

  status.textContent =
    'Downloading automatic picture...';


  google.script.run

    .withSuccessHandler(
      function (result) {

        status.textContent =
          'Picture saved. Saving word...';


        saveWord(
          result.fileName
        );

      }
    )

    .withFailureHandler(
      function (error) {

        status.textContent =
          'Automatic picture could not be saved.';


        alert(
          error.message ||
          'Unable to save automatic picture.'
        );

      }
    )

    .uploadVocabularyImageFromUrl(
      automaticImageUrl,
      word,
      category
    );

}

function uploadEditedImage() {

    document.getElementById(
      'editImageFile'
    );

    document
      .getElementById('editWord')
      .value
      .trim();


  if (!word) {

  }


  if (!currentWord) {

    alert(
      'No word selected.'
    );

    return;

  }


  const file =
    fileInput.files[0];


  const reader =
    new FileReader();


  reader.onload =
    function (event) {

      const base64 =
        event.target.result
          .split(',')[1];


      const fileData = {

        base64:
          base64,

        mimeType:
          file.type

      };


      google.script.run

        .withSuccessHandler(
          function (result) {

            const imageName =
              result.fileName ||
              result.path ||
              '';


            if (!imageName) {

              alert(
                'Image uploaded, but filename was not returned.'

              return;

            }


            const cleanImageName =
              imageName
                .split('/')
                .pop();


            document
              .getElementById(
                'editImage'
              )
              .value =
                cleanImageName;


            const updatedWord = {

              ID:
                currentWord.ID,

              Word:
                document
                  .getElementById(
                    'editWord'
                  )
                  .value
                  .trim(),

              Category:
                document
                  .getElementById(
                    'editCategory'
                  )
                  .value
                  .trim(),

              Level:
                document
                  .getElementById(
                    'editLevel'
                  )
                  .value
                  .trim(),

              Meaning:
                document
                  .getElementById(
                    'editMeaning'
                  )
                  .value
                  .trim(),

              Phonics:
                document
                  .getElementById(
                    'editPhonics'
                  )
                  .value
                  .trim(),

              IPA:
                document
                  .getElementById(
                    'editIPA'
                  )
                  .value
                  .trim(),

              Syllable:
                document
                  .getElementById(
                    'editSyllable'
                  )
                  .value
                  .trim(),

              Image:
                cleanImageName,

              Favorite:
                currentWord.Favorite || ''

            };


            google.script.run

              .withSuccessHandler(
                function () {

                  const index =
                    vocabulary.findIndex(
                      function (item) {

                        return String(
                          item.ID

/* =========================================
   SHUFFLE
========================================= */

function shuffleWords() {

  if (
    !vocabulary ||
    vocabulary.length === 0
  ) {

    return;

  }


  filteredVocabulary =
    [...vocabulary];


  for (
    let i =
      filteredVocabulary.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      filteredVocabulary[i],
      filteredVocabulary[j]
    ] =
    [
      filteredVocabulary[j],
      filteredVocabulary[i]
    ];

  }


  renderWords();

}


/* =========================================
   SPEAK WORD
========================================= */

function speakWord(word) {

  if (!word) {
    return;
  }


  window.speechSynthesis.cancel();


  const speech =
    new SpeechSynthesisUtterance(
      word
    );


  speech.lang =
    'en-US';


  speech.rate =
    0.85;


  window.speechSynthesis.speak(
    speech
  );

}

  right.style.fontSize =
    '28px';

  right.style.cursor =
    'pointer';


  right.onclick =
    function() {

      automaticImageIndex++;

      if (
        automaticImageIndex >=
        automaticImageChoices.length
      ) {

        automaticImageIndex =
          0;

      }

      showEditAutomaticImageChoice();

    };


  wrapper.appendChild(
    left
  );

  wrapper.appendChild(
    imageArea
  );

  wrapper.appendChild(
    right
  );


  preview.appendChild(
    wrapper
  );

}

/* =========================================
   KEYBOARD NAVIGATION
========================================= */

document.addEventListener(
  'keydown',
  function (event) {

    const modal =
      document.getElementById(
        'wordModal'
      );


    if (
      !modal ||
      modal.style.display === 'none'
    ) {

      return;

    }


    const active =
      document.activeElement;


    if (
      active &&
      (
        active.tagName === 'INPUT' ||
        active.tagName === 'TEXTAREA' ||
        active.tagName === 'SELECT'
      )
    ) {

      return;

    }


    if (
      event.key === 'ArrowLeft'
    ) {

      event.preventDefault();

      openPreviousWord();

    }


    if (
      event.key === 'ArrowRight'
    ) {

      event.preventDefault();

      openNextWord();

    }

  }
);


/* =========================================
   EASY SENTENCES
========================================= */

function searchSentences() {

  if (
    !currentWord ||
    !currentWord.Word
  ) {

    return;

  }


  const word =
    currentWord.Word.trim();


  const query =
    'English easy 10 sentences for word "' +
    word +
    '"';


  const url =
    'https://www.google.com/search?q=' +
    encodeURIComponent(
      query
    );


  window.open(
    url,
    '_blank'
  );

}
